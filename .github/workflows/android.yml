name: Android APK

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Build web assets (offline fallback; the app loads the live site)
        run: npm run build
        env:
          VITE_API_URL: /api/v1

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore signing key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/waterhub.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/waterhub.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/WaterHub-1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Build debug APK (no signing secrets set)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: frontend/android
        run: |
          echo "::warning::Signing secrets not set — building a DEBUG APK. Updates will need uninstall/reinstall. Add the ANDROID_* secrets to fix."
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/WaterHub-1.0.${GITHUB_RUN_NUMBER}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WaterHub-APK
          path: WaterHub-*.apk

      - name: Publish as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: WaterHub Android 1.0.${{ github.run_number }}
          files: WaterHub-*.apk
          body: Install on Android — open the APK on the phone and allow "Install unknown apps".
